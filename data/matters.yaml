# 事项模板库（V3 §16 通用 + §17 专业机关）
#
# 原来全县上下只有六种事：信访、材料、督办、调研、协调、应急。
# 于是组织部的科员和公安局的科员，手上的活看起来一模一样。
#
# 现实不是这样。组织部办的是干部考察、班子研判、换届；
# 公安局办的是治安事件、专项行动、大型活动安保；
# 办公厅办的是会务、批示流转、值班信息。
# 同样是"科员"，两个人每天打开桌面看到的东西完全不同。
#
# 每条模板挂一个 kind，指向 work_items.yaml 里那六类判定档——
# 判定规则不变（哪些办法管用、哪些是走过场、哪些是失当），
# 变的是事项本身的来源、名目和归属。
#
# levels 限定哪些层次的人会摊上这件事：
#   科员      具体经办
#   副科级    科室副职
#   正科级    科室正职、小单位一把手
#   副处级    县级领导、部门主官
#   正处级    县级正职
# 不写就是各级都有可能。
#
# matter_type 对应 Matter 模型里的类型，决定这件事走哪条流程、进哪种会。

# ── 通用事项族（§16）──────────────────────────────────
# 这些是大量机关共享的底子。任何机关的人都可能摊上。
