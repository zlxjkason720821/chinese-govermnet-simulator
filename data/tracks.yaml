# 职业路线（蓝图 十二、十三）
#
# 蓝图十二把办公厅单列为"独立职业生态"，并且点名：
# **必须区分办公厅干部和领导个人秘书**，否则秘书路线会被玩成捷径。
# 蓝图十三说组织部是一条特殊履历，但**绝不能变成"在组织部所以升得快"**。
#
# 所以这里定义的不是"升得快慢"，是"往哪儿走"：
# 同样是正科级，办公厅出身的人下一步和乡镇出身的人下一步，本来就不该一样。
#
# 按行政层级分开写。这是原来最大的漏洞：市委办公厅的科员和县委办的科员
# 共用一张梯子，于是不管什么出身，下一步永远是"副局长—局长—副县长"那老三样。
# 市委办公厅的科员，下一步该是秘书处的副处长、或者给领导当秘书，
# 再往后是处长、副秘书长、秘书长，然后外放到县里主政——这是另一条路。
#
# 每一层写三样：
#   ladder  本层级内的上行序列（按职务层次）
#   exits   这条路线在这个层次的典型外放去向
#   exit_note 给玩家看的一句话
#
# 缺哪一层就落回 县 那一层。

systems:
  综合:
    label: 办公厅（办公室）
    note: 连着领导、部门、文件、会议和督查。信息最全，但也最不出头。
    县:
      ladder:
        科员: [秘书, 副主任]
        副科级: [副主任, 主任]
        正科级: [主任]
      exits:
        正科级: [乡镇, 财经, 组织, 综合]
        副处级: [乡镇, 政务, 组织]
      exit_note: 县委办待久了要外放，不外放就一直是给别人服务的人。
    市:
      # 用户说的那条路：市委办公厅科员 → 大秘或秘书一处二处处长
      #               → 副秘书长 → 秘书长 → 外放
      ladder:
        科员: [秘书一处副处长, 秘书二处副处长, 综合处副处长, 督查处副处长,
               书记秘书, 市长秘书, 副市长秘书]
        副科级: [秘书一处处长, 秘书二处处长, 综合处处长, 督查处处长]
        正科级: [副秘书长]
        副处级: [副秘书长]
        正处级: [秘书长]
      exits:
        正科级: [组织, 财经, 综合]
        正处级: [党委, 政务]
        副厅级: [党委, 政务]
      exit_note: 副秘书长到秘书长是办公厅的顶，再往上就得外放到县里主政，
                 或者到市里分管一摊。一直不外放，履历上就永远缺"独当一面"这一条。
    省:
      ladder:
        科员: [副处长, 省委书记秘书, 省长秘书, 副省长秘书]
        副处级: [处长]
        正处级: [副秘书长]
        副厅级: [副秘书长, 秘书长]
      exits:
        正处级: [综合, 组织, 政务]
        副厅级: [党委, 政务]
      exit_note: 省委办公厅出去多是到市里进班子，或者下派到县里主政。
    中央:
      ladder:
        副厅级: [中央领导秘书]
        正厅级: [副部长]
        副部级: [部长]
      exits:
        副厅级: [党委, 政务]
        正厅级: [党委, 政务]
      exit_note: 中办出去是到地方任职。在中央待着看得最全，
                 但没有主政一方的履历，往上也是有顶的。

  组织:
    label: 组织部门
    note: 管干部的人。见过的班子多、政策熟，但这不等于自己升得快。
    县:
      ladder:
        科员: [副主任, 部长]
        副科级: [副主任, 部长]
        正科级: [部长]
        副处级: [部长]
      exits:
        正科级: [综合, 乡镇, 党委]
        副处级: [党委, 乡镇]
      exit_note: 组织部的经历适合党委和干部人事岗位，不是万能通行证。
    市:
      ladder:
        科员: [副处长, 处长]
        副科级: [处长]
        正科级: [副部长]
        副处级: [副部长, 部长]
        正处级: [部长]
      exits:
        正科级: [综合, 党委]
        副处级: [党委, 政务]
        正处级: [党委]
      exit_note: 市委组织部干部处出去常到县里当组织部长或者县委副书记。
    省:
      ladder:
        正处级: [副部长]
        副厅级: [副部长]
        正厅级: [部长]
      exits:
        副厅级: [党委, 综合]
      exit_note: 省委组织部出去一般到市里进班子。

  纪检:
    label: 纪检监察
    note: 和同级党委、上级纪委双向负责，职业路径也因此更独立。
    县:
      ladder:
        科员: [副书记, 书记]
        正科级: [副书记, 书记]
        副处级: [书记]
      exits:
        副处级: [党委, 政法]
      exit_note: 纪检系统内部上行为主，横向出去的少。
    市:
      ladder:
        科员: [副处长, 处长]
        副科级: [处长]
        正科级: [副书记]
        副处级: [副书记]
        正处级: [书记]
      exits:
        副处级: [政法, 党委]
      exit_note: 市纪委出去多是到县里任纪委书记，那是县委常委的位子。

  政法:
    label: 政法系统
    note: 协调公检法司，专业性强，路子相对封闭。
    县:
      ladder:
        科员: [副局长, 部长]
        副科级: [副局长, 局长]
        正科级: [局长, 部长]
      exits:
        正科级: [政务, 党委]
      exit_note: 政法系统出去一般走政府分管或党委政法口。
    市:
      ladder:
        科员: [副处长]
        副科级: [处长, 副局长]
        正科级: [副局长]
        副处级: [局长, 副书记]
        正处级: [局长]
      exits:
        副处级: [政务, 党委]
      exit_note: 市局的人出去常到县里当公安局长兼政法委书记。

  财经:
    label: 财政经济部门
    note: 管钱和项目的地方。业务性强，容易被点名分管。
    县:
      ladder:
        科员: [副局长]
        副科级: [副局长, 局长]
        正科级: [局长]
        副处级: [副县长, 常务副县长]
      exits:
        正科级: [政务, 综合]
        副处级: [政务]
      exit_note: 财经口的人常被放到政府分管经济的位子上。
    市:
      ladder:
        科员: [副处长]
        副科级: [处长]
        正科级: [副局长]
        副处级: [局长]
        正处级: [副市长]
      exits:
        副处级: [政务, 综合]
        正处级: [政务]
      exit_note: 市财政局出来的人，下去多半是常务副县长或者管经济的副市长。

  业务:
    label: 业务部门
    note: 民政、教育、农业这类管具体事务的单位。
    县:
      ladder:
        科员: [副局长]
        副科级: [副局长, 局长]
        正科级: [局长]
      exits:
        正科级: [乡镇, 政务, 综合]
      exit_note: 业务部门要往上走，一般得先去乡镇补基层经历。

  乡镇:
    label: 乡镇
    note: 直接面对群众和土地的地方。最累，但履历最硬。
    县:
      ladder:
        科员: [副乡镇长, 副书记]
        副科级: [乡镇长, 副书记, 书记]
        正科级: [书记]
      exits:
        正科级: [政务, 党委, 财经, 综合]
      exit_note: 乡镇党委书记是县级班子最主要的来源。

  党委:
    label: 党委领导班子
    note: 常委会里的位子。到这一层，个人办事让位于会议和协调。
    省:
      ladder:
        正厅级: [常委, 副书记]
        副部级: [副书记, 书记]
        正部级: [书记]
      exits:
        副部级: [政务, 组织, 纪检]
        正部级: [中央]
      exit_note: 省委书记往上不是"再升一级的省委书记"，是到中央去——
                 国务委员、人大副委员长、政协副主席、中央书记处书记，
                 或者国务院某个部的部长。
    中央:
      ladder:
        正部级: [中央书记处书记, 国务委员, 副委员长, 副主席]
        副国级: [总理, 委员长, 主席]
      exits: {}
      exit_note: 到这一层，行政级别已经不是主要的东西了，党内身份才是。
    县:
      ladder:
        副处级: [副书记, 书记]
        正处级: [书记]
      exits:
        副处级: [政务]
      exit_note: 党委和政府两头互换是常态。
    市:
      ladder:
        正处级: [常委]
        副厅级: [副书记, 书记]
        正厅级: [书记]
      exits:
        副厅级: [政务]
      exit_note: 市委常委往上是副书记、书记，或者到省里的部门。

  政务:
    label: 政府领导班子
    note: 分管一摊具体工作，对结果负责。
    省:
      ladder:
        正厅级: [副省长, 副市长]
        副部级: [省长, 市长]
        正部级: [省长, 市长]
      exits:
        副部级: [党委, 财经]
        正部级: [中央]
      exit_note: 省长往上通常是本省省委书记，或者到国务院某个部去。
    中央:
      ladder:
        正部级: [国务委员, 副总理]
        副国级: [总理]
      exits: {}
      exit_note: 副总理、国务委员是国务院的领导层，不再分管一个部。
    县:
      ladder:
        副处级: [常务副县长, 县长]
        正处级: [县长]
      exits:
        副处级: [党委]
      exit_note: 常务副县长往上多半是县长或者县委副书记。
    市:
      ladder:
        正处级: [副市长]
        副厅级: [副市长, 市长]
        正厅级: [市长]
      exits:
        副厅级: [党委]
      exit_note: 副市长往上是市长，或者转到市委当常委、副书记。

  人大:
    label: 人大机关
    note: 节奏慢，位子稳，年纪大一些的干部常到这里。
    县:
      ladder:
        科员: [副主任]
        副处级: [副主任, 主任]
      exits: {}
      exit_note: 人大政协多是职业后段的去处。

  政协:
    label: 政协机关
    note: 同上。
    县:
      ladder:
        科员: [副主席]
        副处级: [副主席, 主席]
      exits: {}
      exit_note: 人大政协多是职业后段的去处。

  中央:
    label: 中央机关
    note: 中共中央各部门和国务院各部委。这里的正职是正部级，默认进中央委员会。
    中央:
      ladder:
        副部级: [部长, 主任, 行长, 审计长]
        正部级: [中央书记处书记, 国务委员, 副委员长, 副主席, 副总理]
        副国级: [总理, 委员长, 主席]
      exits:
        正部级: [党委, 政务]
      exit_note: 中央部委的部长外放，去的是省委书记、省长。
                 中央和地方两头互换，是这一层最常见的路。

# ── 到中央去 ─────────────────────────────────────────
# 玩家问的是"省委书记之后是什么"。答案分两条，它们是两个轴：
#
#   行政级别　办事员→科员→副科→正科→副处→正处→副厅→正厅→副部→正部→副国→正国
#   党内身份　中央候补委员 → 中央委员 → 政治局委员 → 政治局常委 → 总书记
#
# 这两条不是一回事（蓝图二十三）。一个正部级干部可以不是中央委员，
# 一个中央委员也不等于比谁高一级。
central_path:
  note: 省委书记往上不是"更大的省"，是换一个轴。
  rungs:
    - {level: 正厅级, posts: [市委书记, 市长], next: 省委常委、副省长}
    - {level: 副部级, posts: [省委常委, 副省长, 省委副书记], next: 省委书记、省长、部长}
    - {level: 正部级, posts: [省委书记, 省长, 部长, 主任, 行长, 审计长],
       next: 国务委员、人大副委员长、政协副主席、中央书记处书记、副总理}
    - {level: 副国级, posts: [国务委员, 副总理, 中央书记处书记, 副委员长, 副主席],
       next: 总理、委员长、政协主席}
    - {level: 正国级, posts: [总书记, 总理, 委员长, 政协主席, 国家主席], next: 到顶了}
  identity:
    - {status: 中央候补委员, need: 副部级以上在任，党龄五年以上，党代会当年不满六十八岁,
       note: 只有发言权，没有表决权。中央委员出缺时按得票多少依次递补}
    - {status: 中央委员, need: 省区市党委书记和政府首长、中央和国务院部委正职默认在内,
       note: 这不是"表现好所以当选"，是这个位子本来就在委员会里}
    - {status: 政治局委员, need: 正部级以上，党代会当年不满六十五岁,
       note: 京津沪渝粤新的党委书记按惯例兼任政治局委员——同样是省委书记，
             放在哪个省，党内身份不一样}
    - {status: 政治局常委, need: 担任中央职务，由中央委员会全体会议选举,
       note: 这一层不走常规任用算法}
  caution: 中央委员只在党代会上产生，五年一次。中途当上省委书记的，
           要等下一届才有机会——错过一届，对六十岁的人可能就是职业上限。

# 领导个人秘书（"大秘"）。蓝图十二特别强调它和办公厅干部不是一回事：
# 这是服务性质的岗位，跟人走，领导动了它就没了。
# 不能把它做成"当过秘书所以升得快"。
secretary:
  # 这里不列职务名。"书记秘书""市长秘书"不是全国统一的行政职务名称，
  # 它是一种工作关系：人事表上写的是办公厅某个处的职务，
  # 工作上服务某位领导。库里用 position_slot.serves_slot_id 记这条关系，
  # 职务名照旧是"秘书一处副处长"这样的真实职务。
  #
  # 各地"秘书一处"服务谁也不一样：济南市委办公厅秘书一处管会务和
  # 文件传阅，广州叫综合一处，南京单设市长秘书处。所以不能靠处室名
  # 推断服务对象。
  note: 服务领导本人的岗位。它不是台阶，但它决定你下一步落在哪儿。
  caution: 秘书经历本身不构成任职资格，它给的是见识和信任，不是台阶。
  gain: 天天在领导身边，认识的人和看到的事，是办公厅处长几年也换不来的。
  risk: 你跟过谁，别人都记得。领导落幕那天，你的去向就定了。
  # 秘书不跟着领导走。领导动了，秘书按级别安排出路，
  # 而且怎么安排，取决于领导是怎么走的——这是这条路真正的赌注。
  outlets:
    - {when: 领导升迁,   to: 下放地方主政，默认提一级（副科到正科）}
    - {when: 领导退休,   to: 平调到地方或者本地行政机关}
    - {when: 领导被查,   to: 同样平调}
    - {when: 本人受牵连, to: 人大或者政协，不再安排实职}
  ladder_note: 市委书记、市长的秘书是副科级，外放接的是乡镇党委书记；
               省委书记、省长的秘书是副处级，外放接的是县委书记、县长；
               中央领导的秘书是副厅级，外放接的是市委书记、市长。
               级别是一层层对上的，这条路真正的风险不在级别，在跟谁。
