# 专属领导班子模板 V1
#
# 这些机关连"副职怎么叫、谁是二把手、谁能高配、谁经常兼任"都不一样，
# 不能套同一张模板。所以按机关类型分开写。
#
# 最要紧的一条来自 2025 年修订的《中国共产党工作机关条例》：
# 党的工作机关领导机构一般由正职、副职、派驻纪检监察组组长
# 或者其他成员组成；**正职由上级机构领导成员兼任的，可以设置
# 分管日常工作的副职**。
#
# 所以 daily_work 不是固定槽位，是条件触发的：一把手兼任、高配、
# 顾不上本机关日常事务，才需要有人管日常。普通的民政局、统计局没有。
#
# 这里要把四个"第二"分开，它们经常不是同一个人：
#   operational_no2　实际承担机关日常工作的主要副职
#   rank_no2　　　　 班子排序上的第二位
#   party_no2　　　　党组/党委副书记
#   legal_successor　法定代行职务的人
#
# 另外注意 1986 开局不能直接套 2026 的形态：称谓、职数、兼任习惯
# 都随年代变。带 from/to 的条目由 EraProfile 切换。

defaults:
  # 分管日常工作的副职的称呼。各系统不一样：
  # 党委部门和地方多用"常务副X"，中央公文现在多写"分管日常工作的副X"。
  daily_work_title: 常务副{post}
  # 二把手规则：机关日常由谁管。不写就按班子排序取第二位。
  operational_no2: null

archetypes:

  # ── 党委工作部门 ────────────────────────────────────
  ORGANIZATION_DEPT:
    label: 组织部门
    note: 管干部的人。部长常由同级党委常委兼任，部机关日常由分管日常工作的副部长管。
    principal: {post: 部长, concurrent_with: 常委, concurrent_probability: 0.9}
    daily_work_title: 常务副{post}
    operational_no2: 分管日常工作的副部长
    specialists:
      - {post: 部务委员, probability: 0.4, from: 2000-01-01}
    concurrent_pool: [公务员局局长, 老干部局局长]
    concurrent_density: MEDIUM

  PROPAGANDA_DEPT:
    label: 宣传部门
    principal: {post: 部长, concurrent_with: 常委, concurrent_probability: 0.9}
    operational_no2: 常务副部长
    concurrent_pool: [新闻出版局局长, 文明办主任, 政府新闻办主任]
    concurrent_density: HIGH

  UNITED_FRONT_DEPT:
    label: 统战部门
    note: 兼任生态最密的一个部门。副部长常兼工商联、社会主义学院、侨办的职务。
    principal: {post: 部长, concurrent_with: 常委, concurrent_probability: 0.8}
    operational_no2: 常务副部长
    concurrent_pool: [工商联党组书记, 社会主义学院党组书记, 侨务办公室主任,
                      民族宗教事务局局长]
    concurrent_density: HIGH

  POLITICAL_LEGAL_COMMITTEE:
    label: 政法委员会
    note: 不是"部—副部长"，是"书记—副书记"。协调公检法司，班子结构自成一套。
    principal: {post: 书记, concurrent_with: 常委, concurrent_probability: 0.95}
    daily_work_title: 常务副{post}
    operational_no2: 常务副书记
    specialists:
      - {post: 委员, probability: 0.5}

  PARTY_OFFICE:
    label: 党委办公厅（办公室）
    note: |
      党委秘书长和办公厅主任是两个岗位，可能同一人兼，也可能分设。
      秘书长不因"秘书长"三个字自动成为常委——要看他是不是另有常委身份。
    principal: {post: 主任, concurrent_with: 秘书长, concurrent_probability: 0.6}
    daily_work_title: 分管日常工作的副{post}
    operational_no2: 分管日常工作的副主任

  DISCIPLINE_SUPERVISION:
    label: 纪检监察机关
    note: |
      和同级党委、上级纪委双向负责，不能套普通部门模板。
      监委的主任、副主任、委员是国家监察机关的法定组成人员，
      不只是党内职位。纪委书记兼监委主任是高概率，不是永久规则。
    principal: {post: 书记, concurrent_with: 常委, concurrent_probability: 0.9}
    operational_no2: 副书记
    specialists:
      - {post: 常委, probability: 0.6}
      - {post: 监察委员会主任, probability: 0.95, from: 2018-03-17,
         concurrent_with_principal: true,
         note: 2018 年设立监察委员会，与纪委合署办公}
    legal_procedure: 人大选举

  # ── 政法机关 ────────────────────────────────────────
  PUBLIC_SECURITY:
    label: 公安机关
    note: |
      局长常由同级政府副职兼任，所以几乎一定有常务副局长。
      另有政治部主任这种专业班子成员，还有独立于行政级别的警衔。
    principal: {post: 局长, concurrent_with: 副县长, concurrent_probability: 0.75}
    daily_work_title: 常务副{post}
    operational_no2: 常务副局长
    specialists:
      - {post: 政治部主任, probability: 0.9}
      - {post: 政委, probability: 0.3, note: 部分地区和时期设置，不全国强制}
    extra_rank: 警衔

  COURT:
    label: 审判机关
    note: |
      院长由人大选举产生，不走普通政府局长那套任免程序。
      法官等级是独立于行政级别的另一条序列。
    principal: {post: 院长}
    daily_work_title: 常务副{post}
    operational_no2: 常务副院长
    specialists:
      - {post: 审判委员会专职委员, probability: 0.7}
      - {post: 政治部主任, probability: 0.4}
    extra_rank: 法官等级
    legal_procedure: 人大选举

  PROCURATORATE:
    label: 检察机关
    note: 检察长由人大选举产生，并报上级检察院检察长提请本级人大常委会批准。
    principal: {post: 检察长}
    daily_work_title: 常务副{post}
    operational_no2: 常务副检察长
    specialists:
      - {post: 检察委员会专职委员, probability: 0.7}
    extra_rank: 检察官等级
    legal_procedure: 人大选举

  STATE_SECURITY:
    label: 国家安全机关
    note: |
      公开信息本来就比一般政府部门少得多。为了"细"去虚构几十个处室，
      比留白更不真实。所以这里只给最小结构，其余留空。
    principal: {post: 局长}
    visibility: RESTRICTED
    hide_deputies: true

  # ── 经济与业务部门 ──────────────────────────────────
  DEVELOPMENT_REFORM:
    label: 发展改革部门
    note: 权重大，但不默认设常务副主任。
    principal: {post: 主任}
    operational_no2: null
    specialists:
      - {post: 副主任, concurrent: true, probability: 0.3,
         note: 发改系统确实存在"副主任（兼职）"这种形式}

  FINANCE:
    label: 财政部门
    note: 副职之间最重要的区别是分管什么，而不是谁叫常务。
    principal: {post: 局长}
    operational_no2: null
    specialists:
      - {post: 总会计师, probability: 0.4, from: 1993-01-01}
    portfolios: [预算, 国库, 社保, 经济建设, 行政政法]

  AUDIT:
    label: 审计机关
    note: |
      并不存在"所有党组成员都是副审计长"。
      党内班子成员和行政副职是两个集合，可以不重合。
    principal: {post: 局长}
    operational_no2: null
    specialists:
      - {post: 总审计师, probability: 0.4, from: 1995-01-01}

  EDUCATION:
    label: 教育部门
    note: |
      党委教育工作机构和行政教育部门经常交叉：
      教育工委书记和教育局长可能是同一个人，也可能分设。
    principal: {post: 局长, concurrent_with: 教育工委书记,
                concurrent_probability: 0.6}
    operational_no2: null
    specialists:
      - {post: 总督学, probability: 0.5, from: 1991-01-01}

  HEALTH:
    label: 卫生健康部门
    principal: {post: 局长}
    operational_no2: null
    concurrent_pool: [爱卫会办公室主任, 中医药管理局局长]

  TAXATION:
    label: 税务机关
    note: |
      垂直管理系统：干部不由本地党委管。这是它和民政局最根本的区别，
      也是玩家在税务系统里升迁路线完全不同的原因。
    principal: {post: 局长}
    personnel_control: VERTICAL
    operational_no2: null
    specialists:
      - {post: 总经济师, probability: 0.3, from: 1994-01-01}
      - {post: 纪检组组长, probability: 0.6}

  GOV_OFFICE:
    label: 政府办公厅（办公室）
    note: |
      政府秘书长不是"首长的大秘书"——它是政府常务会议的法定组成人员，
      和办公室主任是两套体系，不能合并。
    principal: {post: 主任, concurrent_with: 秘书长, concurrent_probability: 0.5}
    daily_work_title: 分管日常工作的副{post}
    operational_no2: 分管日常工作的副主任

  GENERIC_DEPARTMENT:
    label: 一般工作部门
    note: |
      民政、统计、农业这类。正职不兼任，所以**没有**常务副局长。
      党组副书记不自动等于常务副职，这两件事要分开。
      班子就是：党组书记局长 + 党组副书记副局长 + 党组成员副局长。
    principal: {post: 局长}
    operational_no2: null

# ── 专业序列 ─────────────────────────────────────────
#
# 警衔、法官等级、检察官等级都不能和行政级别合并。
# 一个正科级的公安局长有警衔，一个正科级的民政局长没有。
#
# 三样都有明确的设立日期，1986 年开局时一个都还没有：
#   1992-07-01  《中华人民共和国人民警察警衔条例》公布施行，五等十三级
#   1997-01-01  《法官等级暂行规定》《检察官等级暂行规定》印发，四等十二级
# 拿 2026 的序列倒推 1986，和拿 2026 的部委表倒推 1986 是一个性质的错。
#
# grades 从低到高。levels 是这一衔级编制给哪些职务层次——
# 这不是我编的对应，是警衔条例第八条写的"职务等级编制警衔"。
extra_ranks:
  警衔:
    from: 1992-07-01
    note: 五等十三级。离休退休保留警衔；调离警察工作岗位的不予保留。
    archetypes: [PUBLIC_SECURITY, STATE_SECURITY]
    grades:
      - {name: 二级警员, levels: [办事员]}
      - {name: 一级警员, levels: [办事员]}
      - {name: 三级警司, levels: [办事员, 科员]}
      - {name: 二级警司, levels: [科员, 副科级]}
      - {name: 一级警司, levels: [副科级, 正科级]}
      - {name: 三级警督, levels: [正科级, 副处级]}
      - {name: 二级警督, levels: [正科级, 副处级, 正处级]}
      - {name: 一级警督, levels: [副处级, 正处级]}
      - {name: 三级警监, levels: [正处级, 副厅级]}
      - {name: 二级警监, levels: [副厅级, 正厅级]}
      - {name: 一级警监, levels: [正厅级]}
      - {name: 副总警监, levels: [副部级]}
      - {name: 总警监, levels: [正部级],
         note: 一般仅授予公安部部长、国家安全部部长}

  法官等级:
    from: 1997-01-01
    note: 四等十二级。最高人民法院院长为首席大法官。
    archetypes: [COURT]
    grades:
      - {name: 五级法官, levels: [办事员, 科员]}
      - {name: 四级法官, levels: [科员, 副科级]}
      - {name: 三级法官, levels: [副科级]}
      - {name: 二级法官, levels: [副科级, 正科级]}
      - {name: 一级法官, levels: [正科级]}
      - {name: 四级高级法官, levels: [正科级, 副处级]}
      - {name: 三级高级法官, levels: [副处级, 正处级]}
      - {name: 二级高级法官, levels: [正处级, 副厅级]}
      - {name: 一级高级法官, levels: [副厅级, 正厅级]}
      - {name: 二级大法官, levels: [正厅级, 副部级]}
      - {name: 一级大法官, levels: [副部级, 正部级]}
      - {name: 首席大法官, levels: [正部级], note: 最高人民法院院长}

  检察官等级:
    from: 1997-01-01
    note: 四等十二级。最高人民检察院检察长为首席大检察官。
    archetypes: [PROCURATORATE]
    grades:
      - {name: 五级检察官, levels: [办事员, 科员]}
      - {name: 四级检察官, levels: [科员, 副科级]}
      - {name: 三级检察官, levels: [副科级]}
      - {name: 二级检察官, levels: [副科级, 正科级]}
      - {name: 一级检察官, levels: [正科级]}
      - {name: 四级高级检察官, levels: [正科级, 副处级]}
      - {name: 三级高级检察官, levels: [副处级, 正处级]}
      - {name: 二级高级检察官, levels: [正处级, 副厅级]}
      - {name: 一级高级检察官, levels: [副厅级, 正厅级]}
      - {name: 二级大检察官, levels: [正厅级, 副部级]}
      - {name: 一级大检察官, levels: [副部级, 正部级]}
      - {name: 首席大检察官, levels: [正部级], note: 最高人民检察院检察长}

# ── 高配 ─────────────────────────────────────────────
# 副主任（正部长级）不是主任。职务是副职，个人职级更高。
# 所以"副局长 = 固定副处"这种写法是错的，职务和职级必须分开。
#
# 高配最常出现在分管日常工作的副职身上——他实际承担整个机关的运转，
# 级别上给一格，是对这个安排的承认。
high_ranked:
  daily_work_probability: 0.35
  note: 只给分管日常工作的副职，而且不是每个都给。

# ── 挂职 ─────────────────────────────────────────────
# 挂职和正常任职完全不是一回事：有期限，到期回原单位，
# **不占实际班子序列**。它给的是见识和履历上的一行字，不是台阶。
secondment:
  years: 2
  note: 一般两年。上级机关干部下派、地方干部上挂，都是这个形式。
  per_year: 2
  levels: [副科级, 正科级, 副处级]
