# ── 兼任（§20）────────────────────────────────────────
#
# 这些是常态，不是特例：县委常委兼组织部长、兼宣传部长、兼纪委书记、
# 兼政法委书记、兼县委办主任；公安局长兼副县长（或县委常委）。
#
# 兼任不是"多一个头衔"那么简单，它有结构性后果：
# 一把手既然是常委、是副县长，就没法天天处理本机关的具体日常事务，
# 于是这类机关才需要设"分管日常工作的副职"。
# 《中国共产党工作机关条例》写的正是这一条：
# 正职由上级机构领导成员兼任的，可以设分管日常工作的副职。
#
# 普通的民政局、统计局没有这种安排，所以也不该有常务副局长。
