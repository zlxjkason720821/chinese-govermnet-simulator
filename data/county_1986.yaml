# 1986 开局：一个县的四套班子与岗位编制
# （技术文档 §2 数据配置、§82 MVP；蓝图文档 十六 四套班子 + 纪委监委）
#
# 机构名用正式全称，简称单列。班子名单按党委、人大、政府、政协的次序排，
# 每套班子内部按 protocol 排序——这个次序本身就是制度的一部分。

scenario_id: county_1986
start_date: 1986-07-15
county_name: 红山县

organizations:
  # 中央。只建关键机构和岗位，不铺满编制——
  # 这一层存在的意义是让中央委员会和政治局有真实的人可选（§46、蓝图二十三）。
  - {key: zhongyang, name: 中国共产党中央委员会, short: 中共中央, type: PARTY,      grade: 正国级, level: CENTRAL, protocol: 1, system: 党委}
  - {key: guowuyuan, name: 国务院,               short: 国务院,   type: GOVERNMENT, grade: 正国级, level: CENTRAL, protocol: 3, system: 政务}
  - {key: zy_zzb,    name: 中共中央组织部,       short: 中央组织部, type: PARTY,    grade: 正部级, level: CENTRAL, parent: zhongyang, system: 组织}
  - {key: zy_bgt,    name: 中共中央办公厅,       short: 中央办公厅, type: PARTY,    grade: 正部级, level: CENTRAL, parent: zhongyang, system: 综合}
  - {key: zy_jwei,   name: 中共中央纪律检查委员会, short: 中央纪委, type: PARTY,    grade: 副国级, level: CENTRAL, parent: zhongyang, system: 纪检}
  - {key: quanguo_rd, name: 全国人民代表大会常务委员会, short: 全国人大常委会, type: PEOPLES_CONGRESS, grade: 正国级, level: CENTRAL, protocol: 2, system: 人大}
  - {key: quanguo_zx, name: 中国人民政治协商会议全国委员会, short: 全国政协, type: CPPCC, grade: 正国级, level: CENTRAL, protocol: 4, system: 政协}
  - {key: guojia,    name: 中华人民共和国,       short: 中华人民共和国, type: STATE, grade: 正国级, level: CENTRAL, protocol: 0, system: 党委}

  # 省级
  - {key: shengwei,  name: 中国共产党河北省委员会, short: 中共河北省委, type: PARTY,      grade: 正部级, level: PROVINCIAL, protocol: 1, parent: zhongyang, system: 党委}
  - {key: shengzf,   name: 河北省人民政府,       short: 河北省人民政府, type: GOVERNMENT, grade: 正部级, level: PROVINCIAL, protocol: 3, parent: guowuyuan, system: 政务}
  - {key: sheng_zzb, name: 中共河北省委组织部,   short: 省委组织部, type: PARTY, grade: 副部级, level: PROVINCIAL, parent: shengwei, system: 组织}
  - {key: sheng_bgt, name: 中共河北省委办公厅,   short: 省委办公厅, type: PARTY, grade: 副部级, level: PROVINCIAL, parent: shengwei, system: 综合}
  - {key: shengzf_bgt, name: 河北省人民政府办公厅, short: 省政府办公厅, type: GOVERNMENT, grade: 副部级, level: PROVINCIAL, parent: shengzf, system: 综合}

  # 市级（红山县的上级）。有了这一层，县委书记才有地方可去，
  # 党校的厅级轮训范围也才落得下来。
  - {key: shiwei,   name: 中国共产党平州市委员会, short: 中共平州市委, type: PARTY,      grade: 正厅级, level: MUNICIPAL, protocol: 1, parent: shengwei, system: 党委}
  - {key: shizf,    name: 平州市人民政府,       short: 平州市人民政府, type: GOVERNMENT, grade: 正厅级, level: MUNICIPAL, protocol: 3, parent: shengzf, system: 政务}
  - {key: shi_bgt,  name: 中共平州市委办公厅,   short: 市委办公厅, type: PARTY,      grade: 正处级, level: MUNICIPAL, parent: shiwei, system: 综合}
  - {key: shizf_bgt, name: 平州市人民政府办公厅, short: 市政府办公厅, type: GOVERNMENT, grade: 正处级, level: MUNICIPAL, parent: shizf, system: 综合}
  - {key: shi_zzb,  name: 中共平州市委组织部,   short: 市委组织部, type: PARTY,      grade: 正处级, level: MUNICIPAL, parent: shiwei, system: 组织}
  - {key: shi_czj,  name: 平州市财政局,         short: 市财政局,   type: GOVERNMENT, grade: 正处级, level: MUNICIPAL, parent: shizf, system: 财经}

  # 四套班子（县级）
  - {key: xianwei,  name: 中国共产党红山县委员会, short: 中共红山县委, type: PARTY,      grade: 正处级, protocol: 1, parent: shiwei, system: 党委}
  - {key: renda,    name: 红山县人民代表大会常务委员会, short: 红山县人大常委会, type: PEOPLES_CONGRESS, grade: 正处级, protocol: 2, system: 人大}
  - {key: xianzf,   name: 红山县人民政府,       short: 红山县人民政府, type: GOVERNMENT, grade: 正处级, protocol: 3, parent: shizf, system: 政务}
  - {key: zhengxie, name: 中国人民政治协商会议红山县委员会, short: 红山县政协, type: CPPCC, grade: 正处级, protocol: 4, system: 政协}
  - {key: jiwei,    name: 中共红山县纪律检查委员会, short: 中共红山县纪委, type: PARTY, grade: 副处级, protocol: 5, parent: xianwei, system: 纪检}

  # 县委工作部门
  - {key: xw_bgs,   name: 中共红山县委办公室,   short: 县委办,     type: PARTY, grade: 正科级, parent: xianwei, system: 综合}
  - {key: zzb,      name: 中共红山县委组织部,   short: 县委组织部, type: PARTY, grade: 正科级, parent: xianwei, system: 组织}
  - {key: xcb,      name: 中共红山县委宣传部,   short: 县委宣传部, type: PARTY, grade: 正科级, parent: xianwei, system: 宣传}
  - {key: tzb,      name: 中共红山县委统战部,   short: 县委统战部, type: PARTY, grade: 正科级, parent: xianwei, system: 宣传}
  - {key: zfw,      name: 中共红山县委政法委员会, short: 县委政法委, type: PARTY, grade: 正科级, parent: xianwei, system: 政法}

  # 政府工作部门
  - {key: zf_bgs,   name: 红山县人民政府办公室, short: 县政府办, type: GOVERNMENT, grade: 正科级, parent: xianzf, system: 综合}
  - {key: czj,      name: 红山县财政局,         short: 财政局,   type: GOVERNMENT, grade: 正科级, parent: xianzf, system: 财经}
  - {key: mzj,      name: 红山县民政局,         short: 民政局,   type: GOVERNMENT, grade: 正科级, parent: xianzf, system: 业务}
  - {key: nyj,      name: 红山县农业局,         short: 农业局,   type: GOVERNMENT, grade: 正科级, parent: xianzf, system: 业务}
  - {key: jyj,      name: 红山县教育局,         short: 教育局,   type: GOVERNMENT, grade: 正科级, parent: xianzf, system: 业务}
  - {key: gaj,      name: 红山县公安局,         short: 公安局,   type: GOVERNMENT, grade: 正科级, parent: xianzf, system: 政法}
  - {key: sjj,      name: 红山县审计局,         short: 审计局,   type: GOVERNMENT, grade: 正科级, parent: xianzf, system: 财经}

  # 乡镇
  - {key: qingyang, name: 中共青阳镇委员会,     short: 青阳镇,   type: TOWNSHIP, grade: 正科级, parent: xianwei, system: 乡镇}
  - {key: shuanghe, name: 中共双河乡委员会,     short: 双河乡,   type: TOWNSHIP, grade: 正科级, parent: xianwei, system: 乡镇}
  - {key: liulin,   name: 中共柳林乡委员会,     short: 柳林乡,   type: TOWNSHIP, grade: 正科级, parent: xianwei, system: 乡镇}

# 干部管理权限（§21）。市级班子由省管，县级四套班子由市管，其余县管。
authorities:
  - {level: CENTRAL, organization: zhongyang}
  - {level: CENTRAL, organization: quanguo_rd}
  - {level: CENTRAL, organization: quanguo_zx}
  - {level: CENTRAL, organization: guojia}
  - {level: CENTRAL, organization: guowuyuan}
  - {level: CENTRAL, organization: shengwei}
  - {level: CENTRAL, organization: shengzf}
  - {level: PROVINCIAL, organization: shengwei}
  - {level: PROVINCIAL, organization: shiwei}
  - {level: PROVINCIAL, organization: shizf}
  - {level: MUNICIPAL, organization: shiwei}
  - {level: MUNICIPAL, organization: xianwei}
  - {level: MUNICIPAL, organization: renda}
  - {level: MUNICIPAL, organization: xianzf}
  - {level: MUNICIPAL, organization: zhengxie}
  - {level: COUNTY,    organization: xianwei}

# protocol：本套班子内部的排序。数字小的排前面。
position_definitions:
  #  中央。总书记、总理、委员长、主席这一层是正国级；
  #  常委的行政职务就出在这里——总书记不可能是省长。
  - {key: zongshuji, name: 总书记,  lead: 1, auth: CENTRAL, min_age: 55, max_age: 70, party: 1, exp: 35, level: 正国级, protocol: 1}
  - {key: zongli,  name: 总理,     lead: 1, auth: CENTRAL, min_age: 55, max_age: 70, party: 1, exp: 35, level: 正国级, protocol: 1}
  - {key: weiyuanzhang, name: 委员长, lead: 1, auth: CENTRAL, min_age: 55, max_age: 70, party: 1, exp: 35, level: 正国级, protocol: 1}
  - {key: zx_zhuxi, name: 主席,    lead: 1, auth: CENTRAL, min_age: 55, max_age: 70, party: 0, exp: 35, level: 正国级, protocol: 1}
  - {key: guojia_zhuxi, name: 主席, lead: 1, auth: CENTRAL, min_age: 55, max_age: 70, party: 1, exp: 35, level: 正国级, protocol: 1}
  - {key: shujichu, name: 书记处书记, lead: 1, auth: CENTRAL, min_age: 52, max_age: 68, party: 1, exp: 32, level: 副国级, protocol: 2}
  - {key: zy_jwsj, name: 书记,     lead: 1, auth: CENTRAL, min_age: 55, max_age: 68, party: 1, exp: 33, level: 副国级, protocol: 2}
  - {key: fuzongli, name: 副总理,  lead: 1, auth: CENTRAL, min_age: 52, max_age: 68, party: 1, exp: 32, level: 副国级, protocol: 2}
  - {key: zy_bzh,  name: 部长,     lead: 1, auth: CENTRAL, min_age: 52, max_age: 65, party: 1, exp: 30, level: 正部级, protocol: 3}
  #  省级
  - {key: sw_sj,   name: 书记,     lead: 1, auth: CENTRAL, min_age: 52, max_age: 65, party: 1, exp: 30, level: 正部级, protocol: 1}
  - {key: shengzhang, name: 省长,  lead: 1, auth: CENTRAL, min_age: 50, max_age: 65, party: 1, exp: 28, level: 正部级, protocol: 1}
  - {key: sw_fsj,  name: 副书记,   lead: 1, auth: CENTRAL, min_age: 48, max_age: 63, party: 1, exp: 25, level: 副部级, protocol: 2}
  - {key: sw_cw,   name: 常委,     lead: 1, auth: CENTRAL, min_age: 46, max_age: 63, party: 1, exp: 23, level: 副部级, protocol: 3}
  - {key: fshengzhang, name: 副省长, lead: 1, auth: CENTRAL, min_age: 45, max_age: 63, party: 0, exp: 22, level: 副部级, protocol: 3}
  - {key: sheng_bzh, name: 部长,   lead: 1, auth: CENTRAL, min_age: 45, max_age: 62, party: 1, exp: 22, level: 副部级, protocol: 4}
  - {key: shengkeyuan, name: 科员, lead: 0, auth: PROVINCIAL, min_age: 18, max_age: 60, party: 0, exp: 0, level: 科员, protocol: 20}
  #  省级办公厅
  - {key: sheng_msz,  name: 秘书长,   lead: 1, auth: CENTRAL,    min_age: 48, max_age: 62, party: 1, exp: 25, level: 副部级, protocol: 4}
  - {key: sheng_fmsz, name: 副秘书长, lead: 1, auth: PROVINCIAL, min_age: 42, max_age: 60, party: 1, exp: 20, level: 正厅级, protocol: 5}
  - {key: sheng_cz,   name: 处长,     lead: 1, auth: PROVINCIAL, min_age: 33, max_age: 57, party: 1, exp: 10, level: 正处级, protocol: 10}
  - {key: sheng_fcz,  name: 副处长,   lead: 1, auth: PROVINCIAL, min_age: 30, max_age: 56, party: 0, exp: 7,  level: 副处级, protocol: 11}
  #  省级领导秘书。级别按惯例定：省委书记、省长的秘书是副处级，
  #  领导升迁时下放到县里主政，正好是正处级——县委书记、县长。
  - {key: sw_sj_ms,   name: 秘书一处副处长, lead: 0, auth: PROVINCIAL, min_age: 30, max_age: 50, party: 1, exp: 8, level: 副处级, protocol: 18}
  - {key: shengz_ms,  name: 秘书一处副处长, lead: 0, auth: PROVINCIAL, min_age: 30, max_age: 50, party: 1, exp: 8, level: 副处级, protocol: 18}
  - {key: fshengz_ms, name: 秘书二处副处长, lead: 0, auth: PROVINCIAL, min_age: 28, max_age: 50, party: 1, exp: 5, level: 正科级, protocol: 19}
  #  中央领导秘书。副厅级，领导升迁时外放正好是正厅级——市委书记、市长。
  - {key: zy_ms,      name: 秘书局副局长, lead: 0, auth: CENTRAL,    min_age: 35, max_age: 55, party: 1, exp: 15, level: 副厅级, protocol: 18}

  #  市级
  - {key: swsj,   name: 书记,       lead: 1, auth: PROVINCIAL, min_age: 45, max_age: 62, party: 1, exp: 20, level: 正厅级, protocol: 1}
  - {key: shizhang, name: 市长,     lead: 1, auth: PROVINCIAL, min_age: 43, max_age: 62, party: 1, exp: 18, level: 正厅级, protocol: 1}
  - {key: swfsj,  name: 副书记,     lead: 1, auth: PROVINCIAL, min_age: 40, max_age: 58, party: 1, exp: 15, level: 副厅级, protocol: 2}
  - {key: swcw,   name: 常委,       lead: 1, auth: PROVINCIAL, min_age: 40, max_age: 58, party: 1, exp: 14, level: 副厅级, protocol: 3}
  - {key: fshizhang, name: 副市长,  lead: 1, auth: PROVINCIAL, min_age: 38, max_age: 58, party: 0, exp: 13, level: 副厅级, protocol: 3}
  - {key: shibuzh, name: 部长,      lead: 1, auth: MUNICIPAL,  min_age: 36, max_age: 58, party: 1, exp: 12, level: 正处级, protocol: 10}
  #  党委秘书长和政府秘书长是两回事。
  #  政府秘书长是《地方各级人民代表大会和地方各级人民政府组织法》规定的
  #  政府常务会议法定组成人员：常务会议由市长、副市长和秘书长组成。
  #  党委秘书长则不因"秘书长"三个字自动成为常委——要看他是不是另有常委身份。
  - {key: mishuzhang, name: 秘书长,  lead: 1, auth: PROVINCIAL, min_age: 40, max_age: 58, party: 1, exp: 16, level: 副厅级, protocol: 4}
  - {key: zf_mishuzhang, name: 秘书长, lead: 1, auth: PROVINCIAL, min_age: 40, max_age: 58, party: 0, exp: 16, level: 副厅级, protocol: 4}
  - {key: xzf_mishuzhang, name: 秘书长, lead: 1, auth: MUNICIPAL, min_age: 35, max_age: 57, party: 0, exp: 10, level: 副处级, protocol: 4}
  - {key: fumishuzhang, name: 副秘书长, lead: 1, auth: MUNICIPAL, min_age: 35, max_age: 56, party: 1, exp: 12, level: 正处级, protocol: 5}
  #  办公厅的处室。原来只有一个笼统的"处长"，于是市委办公厅的科员
  #  和县里的科员一样，下一步永远是副局长那老三样。
  #  处室分开，路线才分得开：文稿的、服务领导的、督查的，走向不一样。
  - {key: ms1chu,  name: 秘书一处处长, lead: 1, auth: MUNICIPAL, min_age: 30, max_age: 55, party: 1, exp: 6,  level: 正科级, protocol: 8}
  - {key: ms2chu,  name: 秘书二处处长, lead: 1, auth: MUNICIPAL, min_age: 30, max_age: 55, party: 1, exp: 6,  level: 正科级, protocol: 9}
  - {key: zhchu,   name: 综合处处长,   lead: 1, auth: MUNICIPAL, min_age: 30, max_age: 55, party: 1, exp: 6,  level: 正科级, protocol: 10}
  - {key: dcchu,   name: 督查处处长,   lead: 1, auth: MUNICIPAL, min_age: 30, max_age: 55, party: 1, exp: 6,  level: 正科级, protocol: 11}
  - {key: chuzhang, name: 处长,     lead: 1, auth: MUNICIPAL,  min_age: 30, max_age: 55, party: 1, exp: 6,  level: 正科级, protocol: 12}
  - {key: ms1fuchu, name: 秘书一处副处长, lead: 1, auth: MUNICIPAL, min_age: 27, max_age: 54, party: 0, exp: 3, level: 副科级, protocol: 14}
  - {key: ms2fuchu, name: 秘书二处副处长, lead: 1, auth: MUNICIPAL, min_age: 27, max_age: 54, party: 0, exp: 3, level: 副科级, protocol: 15}
  - {key: zhfuchu,  name: 综合处副处长,   lead: 1, auth: MUNICIPAL, min_age: 27, max_age: 54, party: 0, exp: 3, level: 副科级, protocol: 16}
  - {key: dcfuchu,  name: 督查处副处长,   lead: 1, auth: MUNICIPAL, min_age: 27, max_age: 54, party: 0, exp: 3, level: 副科级, protocol: 17}
  - {key: fuchuzhang, name: 副处长, lead: 1, auth: MUNICIPAL,  min_age: 27, max_age: 54, party: 0, exp: 3,  level: 副科级, protocol: 18}
  #  领导身边的秘书。这里要说清一件事：
  #  **"书记秘书""市长秘书"不是全国统一的行政职务名称**，
  #  它是一种工作关系。人事表上写的是办公厅某个处的职务，
  #  工作上服务某位领导。而且"秘书一处"服务谁，各地并不一样——
  #  济南市委办公厅秘书一处管的是会务和文件传阅，
  #  广州叫综合一处，南京干脆单设市长秘书处。
  #  所以这里只给正式职务，服务对象由 serves 单独记。
  #  级别按"领导升迁时下放正好接得上"来定：
  #  市委书记、市长的秘书是副科级，外放升一级是正科级——乡镇党委书记、乡镇长。
  #  副市长的秘书是科员，外放升一级是副科级——副乡镇长。
  - {key: sjmishu, name: 秘书一处副处长, lead: 0, auth: MUNICIPAL, min_age: 25, max_age: 45, party: 1, exp: 4, level: 副科级, protocol: 19}
  - {key: szmishu, name: 秘书一处副处长, lead: 0, auth: MUNICIPAL, min_age: 25, max_age: 45, party: 1, exp: 4, level: 副科级, protocol: 19}
  - {key: fszmishu, name: 综合处秘书,     lead: 0, auth: MUNICIPAL, min_age: 24, max_age: 45, party: 0, exp: 2, level: 科员, protocol: 20}
