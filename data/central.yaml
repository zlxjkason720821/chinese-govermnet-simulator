  - {name: 中国共产党中央委员会政法委员会, short: 中央政法委, system: 政法, head: 书记, from: 1980-01-24,
     to: 1988-05-19, note: 1988 年撤销，改设中央政法领导小组}
  - {name: 中国共产党中央委员会政法委员会, short: 中央政法委, system: 政法, head: 书记, from: 1990-03-06,
