# ── 中央委员会的构成惯例 ──────────────────────────────
# 依据党章第二十二条，以及中央委员构成的公开惯例。
committee:
  # 党章：中央委员会委员和候补委员必须有五年以上的党龄
  min_party_years: 5
  # 政治局委员的预备人选一般是 64 周岁以下的正省部级以上干部
  politburo_max_age: 64
  # 2007 年十七大起，中央政治局不再设置候补委员（中央委员会的候补委员一直有）
  politburo_alternate_until: 2007-10-21

  # 默认进中央委员会的岗位。这是惯例，不是规定：
  # "各省、自治区、直辖市党委书记及政府首长"、
  # "中共中央直属机构和国务院下属机构正部级主要负责人"。
  ex_officio:
    - {post: 书记, note: 省、自治区、直辖市党委书记}
    - {post: 省长}
    - {post: 市长, note: 直辖市市长}
    - {post: 主席, note: 自治区主席}
    - {post: 部长, note: 中央和国务院部委主要负责人}
    - {post: 主任}
    - {post: 行长}
    - {post: 审计长}

  # 由政治局委员兼任党委书记的地方。
  # 四个直辖市是定例；广东是经济第一大省；新疆是战略性民族自治区。
  # 历史上山东、四川、湖北也出现过，随该省在全国的分量长期变动。
  politburo_regions: [北京市, 天津市, 上海市, 重庆市, 广东省, 新疆维吾尔自治区]
  politburo_regions_note: 直辖市、经济第一大省、战略性自治区的党委书记由政治局委员兼任。
