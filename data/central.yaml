# 中央机构（1986—2026）
#
# 原来中央只有八个机构、十七个岗位，于是"省委书记往上是什么"这个问题
# 在库里根本没有答案。这张表把中央那一层铺开。
#
# 国务院组成部门在这四十年里改过八次，每次都是真事：
#   1988-04-09  七届人大一次会议　  44 → 41
#   1993-03-22  八届人大一次会议　  41 → 40　设国家经贸委
#   1998-03-10  九届人大一次会议　  40 → 29　力度最大的一次，撤掉一批工业部
#   2003-03-17  十届人大一次会议　  29 → 28　设商务部
#   2008-03-15  十一届人大一次会议  28 → 27　大部制：工信部、交通运输部、人社部、环保部
#   2013-03-14  十二届人大一次会议  27 → 25　撤铁道部
#   2018-03-17  十三届人大一次会议  25 → 26　自然资源部、生态环境部、应急管理部、
#                                            退役军人事务部；撤监察部，设国家监察委员会
#   2023-03-10  十四届人大一次会议  26 → 26
#
# 拿 2026 的部委表倒推 1986，和拿 2026 的区划倒推 1986 是一个性质的错。
# 1986 年没有商务部，有的是对外经济贸易部；没有教育部，有的是国家教育委员会。
#
# 部长、主任、行长、审计长一律正部级。副国级和正国级的职务单列在 top 里。

