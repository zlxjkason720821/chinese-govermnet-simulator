# 工作事项（技术文档 §53-§56，§58 任务窗口）
#
# 这张表解决一个具体问题：数据库凭什么判定玩家办得对不对。
#
# 自由文本办不到——"我先去找老张问问"数据库无从判断（§54）。
# 所以事项有类型，类型决定哪些动作管用、哪些是走过场、哪些是错的。
# 判定依据全部是库里的事实：事项类型、时限、玩家权限、选的对象对不对。
#
# effect 取值：
#   办结   动作可以了结这件事，但要先有实质推进（见 close_needs）
#   推进   有进展，但没完，还要再办
#   走过场 动作合规但对这件事没用，时间白花
#   失当   方式错了，会留下记录
#
# 托人这一项单独说一句。它最多只能"推进"，一处"办结"也没有——
# 找交情能把门敲开，活还是得自己干。而且它挑事：
# 协调督办调研这类要跑几家单位的，人熟真管用；
# 信访是政策问题不是人情问题，材料得自己写，都白跑；
# 应急出了事先找关系而不是先处置，这是要留记录的。
#
# close_needs：办结前至少要推进几次。
# 没有这一条，"向领导汇报"就成了万能解法——什么都还没做就先去汇报，
# 事情不会因为汇报而办成。汇报是收口，不是起手。

kinds:
  信访:
    label: 群众来访
    desc: 有人到单位反映问题，得有个说法。
    days: 20
    close_needs: 1
    relevant: [民政局, 乡镇, 公安局]
    subjects:
      - 低保被取消，来问政策依据
      - 宅基地边界纠纷，两户吵到了办公室
      - 企业欠薪，工人集体来反映
      - 老人赡养纠纷，子女互相推诿
      - 农田灌溉用水分配不均
      - 危房改造补助迟迟没到账
    actions:
      走访: 办结
      联系: 推进
      调阅: 推进
      请示: 推进
      汇报: 走过场
      提出建议: 走过场
      延期: 失当
      托人: 走过场

  材料:
    label: 材料起草
    desc: 上面要一份材料，时限很死。
    days: 10
    close_needs: 1
    relevant: [县委办, 县政府办, 农业局]
    subjects:
      - 本单位上半年工作总结
      - 全县农业生产情况汇报
      - 县委常委会会议材料
      - 上级检查组需要的自查报告
      - 年度工作要点初稿
    actions:
      调阅: 推进
      联系: 推进
      汇报: 办结
      请示: 走过场
      走访: 走过场
      延期: 失当
      托人: 走过场

  督办:
    label: 上级督办
    desc: 上级点名要求办理，办不成要说明理由。
    days: 15
    close_needs: 2
    relevant: [审计局, 公安局, 乡镇]
    subjects:
      - 省里转来的环保整改事项
      - 市委督查室交办的问题线索
      - 上级要求核实的统计数据
      - 限期整改的安全隐患
    actions:
      走访: 推进
      联系: 推进
      调阅: 推进
      请示: 推进
      汇报: 办结
      延期: 失当
      托人: 推进

  调研:
    label: 调研任务
    desc: 领导要摸清一件事的底细。
    days: 30
    close_needs: 2
    relevant: [乡镇, 教育局, 农业局]
    subjects:
      - 乡镇企业经营状况
      - 义务教育辍学情况
      - 农村饮水安全现状
      - 基层干部队伍结构
    actions:
      走访: 推进
      调阅: 推进
      联系: 推进
      汇报: 办结
      请示: 走过场
      延期: 走过场
      托人: 推进

  协调:
    label: 部门协调
    desc: 两个部门意见不一致，需要有人居中。
    days: 20
    close_needs: 1
    relevant: [财政局, 县政府办, 乡镇]
    subjects:
      - 项目用地手续在两个部门之间卡住
      - 财政与业务部门对资金用途有分歧
      - 乡镇与县直单位职责划分不清
    actions:
      联系: 推进
      请示: 推进
      召开会议: 办结
      汇报: 走过场
      走访: 走过场
      延期: 失当
      托人: 推进

  应急:
    label: 突发事件
    desc: 出了事，时间就是一切。
    days: 3
    close_needs: 1
    relevant: [乡镇, 公安局, 教育局]
    subjects:
      - 连日暴雨，部分村庄进水
      - 一处厂房发生安全事故
      - 集中供水管道爆裂
      - 学校食堂发生食物中毒
    actions:
      走访: 推进
      请示: 推进
      联系: 推进
      召开会议: 办结
      汇报: 推进
      调阅: 走过场
      延期: 失当
      托人: 失当

# 办结一件事，组织视野涨多少；办砸了扣多少。
# 这些是记录性后果，不是"好感度"：涨的是"组织掌握到什么程度"（§36）。
effect_attention:
  办结: 2
  推进: 1
  走过场: 0
  失当: -1
  越权: 0
  逾期: -2
