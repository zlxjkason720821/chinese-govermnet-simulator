# 全国省级行政区（1986—2026）
#
# 这个窗口里行政区划真的变过，所以每条都带 valid_from：
#   1988 海南建省（此前属广东）
#   1997 重庆设直辖市（此前属四川）
#   1997 香港回归、1999 澳门回归
# 拿 2026 的区划倒推 1986，就和拿 2008 的党校条例倒推 1986 一样错。
#
# cadre_system: false 的几个，不生成党政领导班子——
# 港澳实行"一国两制"，没有省级党委政府这套建制；台湾的情况另论。
# 它们在区划表里存在，但不参与干部任用。
#
# 按 §72，除玩家所在省之外都是背景：只实例化省级班子，不往下铺市县。

provinces:
