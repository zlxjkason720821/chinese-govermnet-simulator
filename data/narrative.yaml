# 文本模板与词库（技术文档 §48-§52）
#
# 规则一：文本只表达已经发生的世界事实，绝不反过来决定事实（§6）。
# 规则二：一切抽取走 text_rng，不得碰 career_rng（§51）。
# 规则三：同一件事要有很多种说法（§50），否则玩家三十年看同一句话。

phrases:
  时辰:
    - 一早
    - 上午九点多
    - 上午十点
    - 快到中午的时候
    - 午休刚过
    - 下午三点
    - 临下班前
    - 晚上加班的时候
  天候:
    - 天阴着
    - 外面下着小雨
    - 日头很足
    - 起了风
    - 雾还没散
    - 下过雨，院里有积水
    - 天冷得很
    - 闷热
  办公场景:
    - 办公室的门开着
    - 走廊里有人说话
    - 楼下传来自行车铃声
    - 桌上的材料堆了半尺高
    - 暖气片响了一阵
    - 电话铃响了两声又停了
    - 窗外的白杨树响
  通知谈话:
    - "{{ who }}让你过去一趟。"
    - "{{ who }}那边来了话，让你下午去一下。"
    - "办公室通知你，{{ who }}找你谈话。"
    - "{{ who }}的秘书打电话过来，说请你过去。"
    - "有人捎话，说{{ who }}在办公室等你。"
    - "{{ who }}让人带话，问你什么时候有空。"
    - "会后{{ who }}留了你一句：来我这儿一下。"
    - "通知来得没头没尾，只说{{ who }}找你。"
  无事:
    - 这一天没有什么特别的事。
    - 材料看了一上午，没什么动静。
    - 跑了一趟乡里，回来天就黑了。
    - 例行的工作，按部就班。
    - 开了个短会，散得很快。
    - 收发室来了几份文件，都不急。
    - 下午基本在整理台账。
    - 电话不多，办公室很静。

templates:
  # 玩家报到
  player_reported:
    - |
      {{ date_cn }}，{{ 时辰 }}，{{ 天候 }}。
      你到{{ org }}报到，接的是{{ post }}。
      {{ 办公场景 }}。没有人多说什么，算是开始了。
    - |
      {{ date_cn }}。
      介绍信交上去，{{ org }}给你安排了位子，职务是{{ post }}。
      同屋的几个人抬头看了一眼，又低下去。

  # 组织找人谈话。§36 这是"组织视野"，不是好感度。
  organization_talk:
    - |
      {{ 时辰 }}，{{ 通知谈话 }}
      谈了大半个钟头，问的都是工作上的事。
      最后没有结论。
    - |
      {{ 通知谈话 }}
      话说得很平常，问你最近在忙什么，家里怎么样。
      走的时候，什么也没交代。

  # 任免公布。事实早已在数据库里定了，这里只是通知。
  # 本单位的人事，当场宣布。org 是有干部管理权限的那个机关，
  # 不是玩家自己坐的那间办公室——县里的局宣布不了市委副书记。
  appointment_announced:
    - |
      {{ date_cn }}，{{ org }}宣布任免。
      {{ name }}任{{ post }}。
      会开了二十分钟，散会后各自回办公室。
    - |
      {{ date_cn }}，{{ org }}的同志来宣布任免决定。
      {{ name }}任{{ post }}。
      念完文件就散了，前后不到半小时。

  # 别处的任免，你是听来的、看文件知道的，没人来你单位开会宣布。
  appointment_elsewhere:
    - |
      {{ date_cn }}。
      文件下来了：{{ name }}，{{ post }}。
      走廊里议论了半天，也就过去了。
    - |
      {{ date_cn }}，{{ org }}发了任免通知。
      {{ name }}任{{ post }}。
      和你这摊事没什么关系，看过就放下了。
    - |
      {{ date_cn }}。
      听人说起，{{ name }}去当{{ post }}了。
      消息传到这一层，已经是第二手的了。

  appointment_self:
    - |
      {{ date_cn }}，{{ 时辰 }}。
      宣布的时候你坐在下面。念到你名字的时候，会场很安静。
      散会后有人过来握手，说了两句场面话。
      从今天起，你是{{ post }}。

  inspection_started:
    - |
      {{ 时辰 }}，{{ 天候 }}。
      组织部来了几个人，在会议室待了一上午。
      找了几位同志谈话，也找了你。
      没有人告诉你最终会是什么结果。

  retirement:
    - |
      {{ date_cn }}，{{ name }}办了退休手续。
      在办公室坐了最后一个上午，东西装了两个纸箱。
    - |
      {{ date_cn }}。
      {{ name }}到龄退休。单位开了个小会，讲话不长。

  training_enrolled:
    - |
      {{ date_cn }}，通知下来，你去{{ program }}学习。
      为期{{ weeks }}周。同班的大多是各县来的，彼此不熟。

  training_completed:
    - |
      {{ date_cn }}，{{ program }}结业。
      结业证书发下来，同学之间留了通讯地址。
      回到单位，位子还是那个位子。

  institution_migration:
    - |
      {{ date_cn }}。
      {{ note }}
      文件一层层发下来，学习了好几次。具体怎么落实，还要再看。

  idle:
    - |
      {{ date_cn }}，{{ 天候 }}。{{ 无事 }}
